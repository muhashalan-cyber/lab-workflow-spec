# CIPHER Lab Workflow System — home-lab stack
#
# NOT TESTED. Assembled in a sandbox with no Docker Hub access, so no image here has
# been pulled or run. Verify every image tag and pin it to a digest before first deploy.
#
# Only `proxy` publishes a port. Everything else sits on the internal network.

name: labflow

services:
  proxy:
    image: caddy:2-alpine          # pin to a digest
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - storage:/app/storage
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    volumes:
      - storage:/app/storage
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/app/storage
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine      # pin to a digest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine          # pin to a digest
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge:
  internal:
    internal: true

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
